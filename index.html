<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>
  <main>
    <article class="card">
      <img class="card__img" src="./assets/images/illustration-article.svg" alt="Article's illustration" loading="lazy">
      <section class="card__content">
        <span class="card__content__tag text-preset-3-bold">Learning</span>
        <time class="card__content__date text-preset-3" datetime="2023-12-21">Published 21 Dec 2023</time>
        <h1 class="card__content__title text-preset-1">HTML & CSS foundations</h1>
        <p class="card__content__description text-preset-2">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </section>
      <figure class="card__author">
        <img class="card__author__img" src="./assets/images/image-avatar.webp" alt="Greg Hooper, author of the article" loading="lazy">
        <figcaption class="card__author__name text-preset-3-bold">Greg Hooper</figcaption>
      </figure>
    </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
      rel="nonopener nonreferrer">Frontend Mentor</a>.
    Coded by <a href="https://github.com/huyphan2210" target="_blank" rel="nonopener nonreferrer">Your Name Here</a>.
  </footer>
</body>

</html>
